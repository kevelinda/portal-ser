<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Portal SER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/aluno.css">
</head>
<body class="pagina-login">
  <header class="topo">
    <a class="topo-logo" href="index.html" aria-label="Voltar para o início">
      <span class="topo-portal">Portal</span>
      <span class="topo-ser">SER</span>
    </a>
  </header>

  <main class="login">
    <h1>Crie sua conta</h1>

    <form class="cartao" id="form-cadastro" novalidate>
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" autocomplete="name" required>

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required>

      <label for="ano">Ano</label>
      <select id="ano" name="ano" required>
        <option value="" disabled selected>Selecione o ano</option>
        <option value="1">1º ano</option>
        <option value="2">2º ano</option>
        <option value="3">3º ano</option>
      </select>

      <label for="periodo">Período</label>
      <select id="periodo" name="periodo" required>
        <option value="" disabled selected>Selecione o período</option>
        <option value="manha">Manhã</option>
        <option value="tarde">Tarde</option>
        <option value="noite">Noite</option>
      </select>

      <label for="curso">Curso</label>
      <select id="curso" name="curso" required>
        <option value="" disabled selected>Selecione o curso</option>
        <option value="informatica">Informática para Internet</option>
        <option value="administracao">Administração</option>
        <option value="rh">Recursos Humanos</option>
        <option value="meio-ambiente">Meio Ambiente</option>
        <option value="marketing">Marketing</option>
        <option value="design-de-interiores">Design de Interiores</option>
      </select>

      <p class="erro" id="erro" role="alert" hidden></p>

      <button type="submit" class="entrar">Cadastrar</button>
      <p class="troca">Já tem conta? <a href="loginaluno.html">Entrar</a></p>
    </form>
  </main>

  <script type="module">
    import { db } from "./config/firebase.js";
    import { ref, get, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const form = document.getElementById("form-cadastro");
    const erro = document.getElementById("erro");
    const cpfInput = document.getElementById("cpf");

    function mostrarErro(msg) {
      erro.textContent = msg;
      erro.hidden = false;
    }

    cpfInput.addEventListener("input", () => {
      let v = cpfInput.value.replace(/\D/g, "").slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, "$1.$2")
           .replace(/(\d{3})(\d)/, "$1.$2")
           .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      cpfInput.value = v;
    });

    async function cpfJaCadastrado(cpfLimpo) {
      const diretoSnap = await get(ref(db, `alunos/${cpfLimpo}`));
      if (diretoSnap.exists()) return true;

      const todosSnap = await get(ref(db, "alunos"));
      if (!todosSnap.exists()) return false;

      let encontrado = false;
      todosSnap.forEach((child) => {
        const val = child.val() || {};
        const cpfSalvo = String(val.cpf || child.key || "").replace(/\D/g, "");
        if (cpfSalvo === cpfLimpo) {
          encontrado = true;
        }
      });
      return encontrado;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      erro.hidden = true;

      const nome = document.getElementById("nome").value.trim();
      const cpf = cpfInput.value.replace(/\D/g, "");
      const ano = document.getElementById("ano").value;
      const periodo = document.getElementById("periodo").value;
      const curso = document.getElementById("curso").value;

      if (!nome || cpf.length !== 11 || !ano || !periodo || !curso) {
        return mostrarErro("Preencha todos os campos, incluindo o período, e digite um CPF válido com 11 números.");
      }

      try {
        if (await cpfJaCadastrado(cpf)) {
          return mostrarErro("Este CPF já possui cadastro. Cada aluno pode ter apenas uma conta; clique em 'Entrar'.");
        }

        const dadosAluno = {
          nome,
          cpf,
          ano,
          periodo,
          curso,
          criadoEm: new Date().toISOString()
        };

        await set(ref(db, `alunos/${cpf}`), dadosAluno);
        localStorage.setItem("alunoLogado", JSON.stringify(dadosAluno));

        window.location.href = "homealuno.html";
      } catch (err) {
        console.error("Erro ao cadastrar:", err);
        mostrarErro("Erro ao salvar no banco de dados. Verifique a conexão.");
      }
    });
  </script>
</body>
</html>
