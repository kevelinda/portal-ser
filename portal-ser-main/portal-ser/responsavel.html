<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login do responsável | Portal SER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/aluno.css">
</head>
<body class="pagina-login">
  <header class="topo">
    <a class="topo-logo" href="index.html" aria-label="Voltar para o início">
      <span class="topo-portal">Portal</span>
      <span class="topo-ser">SER</span>
    </a>
  </header>

  <main class="login">
    <h1>Olá Responsável!</h1>

    <form class="cartao" id="form-login" novalidate>
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" name="nome" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>

      <p class="erro" id="erro" role="alert" hidden></p>

      <button type="submit" class="entrar">Entrar</button>
    </form>
  </main>

  <script type="module">
    import { db } from "./config/firebase.js";
    import { ref, get, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const form = document.getElementById("form-login");
    const nomeInput = document.getElementById("nome");
    const senhaInput = document.getElementById("senha");
    const erro = document.getElementById("erro");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      erro.hidden = true;

      const nome = nomeInput.value.trim();
      const senha = senhaInput.value;

      if (!nome || !senha) {
        erro.textContent = "Preencha o nome completo e a senha.";
        erro.hidden = false;
        return;
      }

      try {
        const nomeChave = nome
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]/g, "_");

        const respRef = ref(db, `responsaveis/${nomeChave}`);
        const snapshot = await get(respRef);

        if (snapshot.exists()) {
          const dados = snapshot.val();
          if (dados.senha !== senha) {
            erro.textContent = "Senha incorreta para este responsável.";
            erro.hidden = false;
            return;
          }
        } else {
          await set(respRef, {
            nome: nome,
            senha: senha,
            criadoEm: new Date().toISOString()
          });
        }

        localStorage.setItem("responsavelLogado", JSON.stringify({ nome }));
        window.location.href = "homeresponsa.html";
      } catch (err) {
        console.error("Erro no acesso do responsável:", err);
        erro.textContent = "Erro: " + err.message;
        erro.hidden = false;
      }
    });
  </script>
</body>
</html>
