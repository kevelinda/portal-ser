<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login do aluno | Portal SER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/aluno.css">
</head>
<body class="pagina-login">
  <header class="topo">
    <a class="topo-logo" href="index.html" aria-label="Voltar para o início">
      <span class="topo-portal">Portal</span>
      <span class="topo-ser">SER</span>
    </a>
  </header>

  <main class="login">
    <h1>Olá Aluno(a)!</h1>

    <form class="cartao" id="form-login" novalidate>
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" name="nome" autocomplete="username" required>

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required>

      <p class="sucesso" id="sucesso" role="status" hidden>Cadastro feito! Entre com seu nome e CPF.</p>
      <p class="erro" id="erro" role="alert" hidden></p>

      <button type="submit" class="entrar">Entrar</button>
      <p class="troca">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </form>
  </main>

  <script type="module">
    import { db } from "./config/firebase.js";
    import { ref, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const form = document.getElementById("form-login");
    const erro = document.getElementById("erro");
    const cpf = document.getElementById("cpf");

    if (new URLSearchParams(window.location.search).get("cadastro") === "ok") {
      document.getElementById("sucesso").hidden = false;
    }

    cpf.addEventListener("input", () => {
      let v = cpf.value.replace(/\D/g, "").slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, "$1.$2")
           .replace(/(\d{3})(\d)/, "$1.$2")
           .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      cpf.value = v;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      erro.hidden = true;

      const nomeDigitado = form.nome.value.trim();
      const cpfNumeros = form.cpf.value.replace(/\D/g, "");

      if (!nomeDigitado || cpfNumeros.length !== 11) {
        erro.textContent = "Preencha o nome completo e um CPF com 11 dígitos.";
        erro.hidden = false;
        return;
      }

      try {
        const snapshot = await get(ref(db, `alunos/${cpfNumeros}`));

        if (!snapshot.exists()) {
          erro.textContent = "CPF não encontrado. Faça seu cadastro primeiro.";
          erro.hidden = false;
          return;
        }

        const dadosAluno = snapshot.val();

        if (dadosAluno.nome.toLowerCase() !== nomeDigitado.toLowerCase()) {
          erro.textContent = "O nome informado não confere com o CPF cadastrado.";
          erro.hidden = false;
          return;
        }

        localStorage.setItem("alunoLogado", JSON.stringify(dadosAluno));
        window.location.href = "homealuno.html";
      } catch (err) {
        console.error("Erro no login:", err);
        erro.textContent = "Erro ao conectar com o banco de dados.";
        erro.hidden = false;
      }
    });
  </script>
</body>
</html>
